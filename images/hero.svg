      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1350" cy="150" r="260" fill="#3b82f6" opacity="0.35"/>
  <circle cx="220" cy="780" r="300" fill="#1d4ed8" opacity="0.45"/>

  <!-- laptop with code (left) -->
  <g transform="translate(120 250)" opacity="0.9">
    <rect x="0" y="0" width="420" height="270" rx="18" fill="#0f172a"/>
    <rect x="18" y="18" width="384" height="234" rx="8" fill="#111c3a"/>
    <rect x="40" y="48" width="70" height="12" rx="6" fill="#f472b6"/>
    <rect x="120" y="48" width="150" height="12" rx="6" fill="#93c5fd"/>
    <rect x="70" y="80" width="200" height="12" rx="6" fill="#fde68a"/>
    <rect x="70" y="112" width="140" height="12" rx="6" fill="#86efac"/>
    <rect x="220" y="112" width="110" height="12" rx="6" fill="#93c5fd"/>
    <rect x="70" y="144" width="240" height="12" rx="6" fill="#fde68a"/>
