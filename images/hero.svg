    <text x="780" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">AI</text>
  </g>

  <!-- phone with chat bubbles (right) -->
  <g transform="translate(1040 160)" opacity="0.95">
    <rect x="0" y="0" width="300" height="560" rx="40" fill="#0f172a"/>
    <rect x="16" y="40" width="268" height="480" rx="20" fill="#f8fafc"/>
    <rect x="110" y="16" width="80" height="10" rx="5" fill="#1e293b"/>
    <rect x="34" y="70" width="200" height="90" rx="18" fill="#dcfce7"/>
    <rect x="52" y="92" width="150" height="10" rx="5" fill="#16a34a" opacity="0.6"/>
    <rect x="52" y="112" width="120" height="10" rx="5" fill="#16a34a" opacity="0.6"/>
    <rect x="52" y="132" width="160" height="10" rx="5" fill="#16a34a" opacity="0.6"/>
    <rect x="96" y="180" width="170" height="60" rx="18" fill="#e2e8f0"/>
    <rect x="114" y="202" width="120" height="10" rx="5" fill="#64748b" opacity="0.6"/>
    <rect x="34" y="260" width="210" height="110" rx="18" fill="#dcfce7"/>
    <rect x="52" y="282" width="170" height="10" rx="5" fill="#16a34a" opacity="0.6"/>
    <rect x="52" y="302" width="140" height="10" rx="5" fill="#16a34a" opacity="0.6"/>
    <rect x="52" y="322" width="160" height="10" rx="5" fill="#16a34a" opacity="0.6"/>
    <rect x="52" y="342" width="90" height="10" rx="5" fill="#16a34a" opacity="0.6"/>
    <path d="M60 420 l18 18 l34 -38" fill="none" stroke="#16a34a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

